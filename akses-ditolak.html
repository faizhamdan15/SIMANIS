<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Akses Ditolak — SIMANIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,Arial,sans-serif;background:#f3f8f5;color:#18372c}
    .card{width:min(540px,100%);background:#fff;border:1px solid #dce9e2;border-radius:24px;padding:28px;box-shadow:0 20px 55px rgba(5,70,45,.12);text-align:center}
    .icon{width:70px;height:70px;border-radius:22px;margin:0 auto 17px;display:grid;place-items:center;background:#fff0ed;color:#a52d22}
    .icon svg{width:33px;height:33px}.eyebrow{font-size:9px;font-weight:800;letter-spacing:.12em;color:#8a5a00}.card h1{font-size:24px;margin:7px 0 9px;color:#075b3a}.card p{font-size:12px;line-height:1.7;color:#65736b;margin:0 auto;max-width:430px}
    .meta{margin:18px 0;background:#f7faf8;border-radius:13px;padding:11px;font-size:10px;color:#5c7066}
    .actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.btn{display:inline-flex;text-decoration:none;border-radius:11px;padding:10px 14px;font-size:10px;font-weight:800;border:1px solid #d5e3dc;color:#075b3a;background:#fff}.btn.primary{background:#075b3a;color:#fff;border-color:#075b3a}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 3 4 6v5c0 5.2 3.4 8.8 8 10 4.6-1.2 8-4.8 8-10V6l-8-3Z"/>
        <path d="m9.5 9.5 5 5m0-5-5 5"/>
      </svg>
    </div>
    <div class="eyebrow">SIMANIS ACCESS CONTROL</div>
    <h1>Akses Tidak Diizinkan</h1>
    <p>Akun ini tidak memiliki hak melihat modul yang diminta, atau SIMANIS belum dapat memverifikasi hak akses dengan aman.</p>
    <div id="meta" class="meta">Memeriksa konteks akses...</div>
    <div class="actions">
      <a class="btn primary" href="dashboard.html">Kembali ke Dashboard</a>
      <a class="btn" href="index.html">Login Ulang</a>
    </div>
  </main>
<script>
const q=new URLSearchParams(location.search);
const moduleCode=(q.get("module")||"-").replace(/[^A-Z0-9_]/gi,"").slice(0,60)||"-";
const reason=q.get("reason")==="check"
  ?"Verifikasi permission tidak berhasil. Akses ditutup untuk keamanan."
  :"Role akun tidak memiliki hak View pada modul ini.";
document.getElementById("meta").textContent=`Modul: ${moduleCode} · ${reason}`;
</script>
</body>
</html>
