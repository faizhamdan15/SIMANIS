<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>Halaman Tidak Ditemukan — MA Nurul Islam</title>
<link rel="manifest" href="/site.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6faf8;color:#173c31;font-family:Inter,system-ui,sans-serif}
a{text-decoration:none}.page{min-height:100vh;display:grid;place-items:center;padding:28px}
.card{width:min(760px,100%);background:#fff;border:1px solid #dfe8e3;border-radius:22px;padding:38px;box-shadow:0 18px 50px rgba(8,55,39,.08);text-align:center}
.logo{width:72px;height:72px;object-fit:contain;margin:0 auto 20px}.code{font:700 72px/1 Lora,serif;color:#075b3a;letter-spacing:-.04em}
.eyebrow{display:block;margin:12px 0 7px;color:#c99a2e;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
h1{font:700 29px/1.25 Lora,serif;margin:0;color:#063b2a}p{max-width:570px;margin:12px auto 0;color:#6d7e76;font-size:12px;line-height:1.75}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:24px}
.btn{min-height:44px;padding:0 15px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}
.btn.primary{background:#075b3a;color:#fff}.btn.secondary{border:1px solid #b8cec4;color:#075b3a;background:#fff}
.links{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-top:24px;padding-top:19px;border-top:1px solid #edf2ef}
.links a{color:#61766d;font-size:9px;font-weight:700}
@media(max-width:560px){.card{padding:28px 20px}.code{font-size:58px}h1{font-size:24px}.actions{display:grid}.btn{width:100%}}
</style>
</head>
<body>
<main class="page">
  <section class="card">
    <img class="logo" src="/logo.png" alt="Logo MA Nurul Islam">
    <div class="code">404</div>
    <span class="eyebrow">MA Nurul Islam</span>
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang Anda buka mungkin sudah berubah, salah diketik, atau halaman tersebut tidak tersedia. Gunakan tautan di bawah untuk kembali ke portal resmi madrasah.</p>
    <div class="actions">
      <a class="btn primary" href="/">Kembali ke Beranda</a>
      <a class="btn secondary" href="/berita-publik.html">Lihat Berita</a>
    </div>
    <div class="links">
      <a href="/profil.html">Profil</a>
      <a href="/prestasi-publik.html">Prestasi</a>
      <a href="/pengumuman-publik.html">Pengumuman</a>
      <a href="/agenda-publik.html">Agenda</a>
    </div>
  </section>
</main>
</body>
</html>
