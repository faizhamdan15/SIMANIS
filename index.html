<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login — SIMANIS</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand">
      <img src="logo.png" alt="Logo MA Nurul Islam"/>
      <div>
        <h1>SIMANIS</h1>
        <p>Sistem Informasi MA Nurul Islam</p>
        <span>Satu Sistem, Semua Layanan Madrasah</span>
      </div>
    </section>

    <section class="login-card">
      <div class="login-heading">
        <h2>Masuk ke SIMANIS</h2>
        <p>Guru dapat menggunakan username yang diberikan admin.</p>
      </div>

      <form id="loginForm">
        <label>
          <span>Email / Username</span>
          <input id="email" type="text" autocomplete="username" required placeholder="guru01 atau nama@email.com"/>
        </label>
        <label>
          <span>Password</span>
          <div class="password-wrap">
            <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"/>
            <button type="button" id="togglePassword" class="ghost-btn">Lihat</button>
          </div>
        </label>
        <button type="submit" id="loginBtn" class="primary-btn" disabled>Menyiapkan...</button>
        <div id="loginMessage" class="form-message" aria-live="polite"></div>
      </form>

      <div class="login-foot">MA Nurul Islam · SIMANIS 2026</div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="sdk-loader.js"></script>
  <script src="login.js"></script>
</body>
</html>
