<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login — SIMANIS</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    /* SIMANIS Login V1.2 FIX - scoped, independen dari styles.css global */
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body.login-page{min-height:100vh;background:linear-gradient(135deg,#06452f 0%,#0a6942 55%,#1e7d3f 100%);color:#173f30;display:grid;place-items:center;padding:24px}
    .login-page .login-shell{width:min(980px,100%);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.23);min-height:570px}
    .login-page .login-brand{position:relative;background:linear-gradient(160deg,#06472f 0%,#075b3a 55%,#0a6f45 100%);padding:54px 48px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;overflow:hidden}
    .login-page .login-brand::before{content:"";position:absolute;width:330px;height:330px;border:1px solid rgba(255,255,255,.08);border-radius:50%;right:-125px;top:-95px}
    .login-page .login-brand::after{content:"";position:absolute;width:220px;height:220px;background:rgba(255,215,0,.08);border-radius:50%;left:-105px;bottom:-110px}
    .login-page .login-brand>img{display:block!important;width:96px!important;height:96px!important;max-width:96px!important;max-height:96px!important;object-fit:contain!important;border-radius:18px!important;background:#fff!important;padding:7px!important;border:3px solid rgba(255,255,255,.88)!important;margin:0 0 26px!important;position:relative;z-index:1}
    .login-page .login-brand>div{position:relative;z-index:1}
    .login-page .login-brand h1{margin:0;font-size:42px;line-height:1;font-weight:900;letter-spacing:.4px;color:#fff}
    .login-page .login-brand p{margin:12px 0 5px;font-size:16px;font-weight:700;color:rgba(255,255,255,.93)}
    .login-page .login-brand span{display:block;font-size:12px;color:rgba(255,255,255,.72);letter-spacing:.2px}
    .login-page .login-card{padding:54px 48px;display:flex;flex-direction:column;justify-content:center;background:#fff}
    .login-page .login-heading h2{margin:0;color:#075b3a;font-size:28px;line-height:1.2;font-weight:900}
    .login-page .login-heading p{margin:9px 0 28px;color:#708078;font-size:13px;line-height:1.55}
    .login-page form{display:grid;gap:16px}
    .login-page form>label>span{display:block;margin-bottom:7px;font-size:12px;font-weight:800;color:#3e544a}
    .login-page input{width:100%;height:48px;border:1px solid #d7e3dd;background:#fbfdfc;border-radius:12px;padding:0 14px;font-size:14px;outline:none;transition:.2s}
    .login-page input:focus{border-color:#0b7a4b;box-shadow:0 0 0 3px rgba(11,122,75,.12);background:#fff}
    .login-page .password-wrap{position:relative}
    .login-page .password-wrap input{padding-right:92px}
    .login-page .ghost-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#0b7347;font-weight:800;font-size:11px;cursor:pointer;padding:8px}
    .login-page .primary-btn{height:48px;border:0;border-radius:12px;background:linear-gradient(135deg,#0b7347,#0a8b54);color:#fff;font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 10px 22px rgba(11,115,71,.18);margin-top:3px}
    .login-page .primary-btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
    .login-page .form-message{min-height:18px;font-size:12px;line-height:1.45;color:#a33e35}
    .login-page .form-message.ok{color:#08733f}
    .login-page .login-foot{margin-top:28px;border-top:1px solid #e8efeb;padding-top:17px;color:#89958f;font-size:11px;text-align:center}
    @media(max-width:760px){
      body.login-page{padding:14px}
      .login-page .login-shell{grid-template-columns:1fr;min-height:auto;border-radius:20px}
      .login-page .login-brand{padding:28px 26px;display:grid;grid-template-columns:68px 1fr;gap:15px;align-items:center}
      .login-page .login-brand>img{width:68px!important;height:68px!important;max-width:68px!important;max-height:68px!important;margin:0!important;border-radius:14px!important}
      .login-page .login-brand h1{font-size:29px}
      .login-page .login-brand p{font-size:12px;margin:6px 0 3px}
      .login-page .login-brand span{font-size:10px}
      .login-page .login-card{padding:32px 25px}
      .login-page .login-heading h2{font-size:23px}
    }
  </style>

</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand">
      <img src="logo.png" alt="Logo MA Nurul Islam"/>
      <div>
        <h1>SIMANIS</h1>
        <p>Sistem Informasi MA Nurul Islam</p>
        <span>Satu Sistem, Semua Layanan Madrasah</span>
      </div>
    </section>

    <section class="login-card">
      <div class="login-heading">
        <h2>Masuk ke SIMANIS</h2>
        <p>Guru dapat menggunakan username yang diberikan admin.</p>
      </div>

      <form id="loginForm">
        <label>
          <span>Email / Username</span>
          <input id="email" type="text" autocomplete="username" required placeholder="guru01 atau nama@email.com"/>
        </label>
        <label>
          <span>Password</span>
          <div class="password-wrap">
            <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"/>
            <button type="button" id="togglePassword" class="ghost-btn">Lihat</button>
          </div>
        </label>
        <button type="submit" id="loginBtn" class="primary-btn" disabled>Menyiapkan...</button>
        <div id="loginMessage" class="form-message" aria-live="polite"></div>
      </form>

      <div class="login-foot">MA Nurul Islam · SIMANIS 2026</div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="sdk-loader.js"></script>
  <script src="login.js"></script>
</body>
</html>
