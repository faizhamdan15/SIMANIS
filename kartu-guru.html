<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kartu Guru — SIMANIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    .kg-wrap{max-width:1050px;margin:auto}
    .kg-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px}
    .kg-head h2{margin:0;color:var(--green-950)}.kg-head p{margin:6px 0 0;color:var(--muted);font-size:11px}
    .kg-back{display:inline-flex;text-decoration:none;border:1px solid var(--line);padding:10px 13px;border-radius:11px;color:var(--green-900);font-size:11px;font-weight:800;background:#fff}
    .kg-panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
    .kg-search{width:100%;border:1px solid #d7e2dc;border-radius:12px;padding:11px 12px;margin-bottom:14px}
    .kg-list{display:grid;gap:10px}.kg-item{border:1px solid #e4ebe7;border-radius:14px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
    .kg-name{font-weight:800;color:var(--green-950);font-size:13px}.kg-meta{font-size:10px;color:var(--muted);margin-top:4px}.kg-badge{display:inline-flex;margin-top:7px;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:800}.kg-on{background:#dff4e7;color:#08743f}.kg-off{background:#f1f3f2;color:#65736b}
    .kg-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.kg-actions button{border:1px solid #d7e2dc;background:#fff;border-radius:9px;padding:8px 9px;font-size:9px;font-weight:800;color:var(--green-900);cursor:pointer}.kg-actions .primary{background:var(--green-800);color:#fff;border-color:var(--green-800)}.kg-actions .danger{color:#a52d22}
    .kg-card-modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:9999}.kg-card-modal.hidden{display:none}.kg-modal-box{background:#fff;border-radius:20px;padding:18px;width:min(500px,100%)}
    .teacher-card{width:100%;aspect-ratio:1.586/1;border-radius:18px;padding:22px;background:linear-gradient(135deg,#075b3a,#0b7347);color:#fff;display:grid;grid-template-columns:1fr 120px;gap:18px;align-items:center}.teacher-card h3{font-size:22px;margin:0}.teacher-card p{font-size:11px;opacity:.8}.qr-box{background:#fff;padding:8px;border-radius:12px;width:116px;height:116px;display:grid;place-items:center}
    .kg-modal-actions{display:flex;gap:8px;margin-top:12px}.kg-modal-actions button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:800;cursor:pointer}.kg-modal-actions .primary{background:var(--green-800);color:#fff}
    @media(max-width:700px){.kg-item{grid-template-columns:1fr}.kg-actions{justify-content:flex-start}.teacher-card{grid-template-columns:1fr 95px;padding:16px}.qr-box{width:92px;height:92px;padding:5px}}
    @media print{body *{visibility:hidden!important}.teacher-card,.teacher-card *{visibility:visible!important}.teacher-card{position:absolute;left:0;top:0;width:86mm;height:54mm;border-radius:3mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style>
</head>
<body>
<div id="loading" class="loading-overlay">Memuat Kartu Guru...</div>
<div class="app">
  <aside class="sidebar">
    <div class="side-brand"><img src="logo.png" alt="Logo"><div><strong>SIMANIS</strong><span>Sistem Informasi MA Nurul Islam</span></div></div>
    <div class="nav-title">MENU</div><nav id="sidebarMenu"></nav>
    <div class="sidebar-footer"><div class="user-mini"><strong id="sideUserName">-</strong><span id="sideUserRole">-</span></div><button id="logoutBtn" class="logout-btn">Keluar</button></div>
  </aside>
  <section class="content">
    <header class="topbar"><div><h1>SIMANIS</h1><p>Sistem Informasi MA Nurul Islam · Kartu Guru</p></div><div class="topbar-right"><strong id="headerUser">-</strong><span id="currentDate">-</span></div></header>
    <main class="main">
      <div class="kg-wrap">
        <section class="kg-head">
          <div><h2>Kartu Guru</h2><p>Terbitkan, cetak, pakai kartu lama, atau blokir kartu QR untuk absensi SIMANIS.</p></div>
          <a class="kg-back" href="absensi-guru.html">← Absensi Guru</a>
        </section>
        <section class="kg-panel">
          <input id="searchInput" class="kg-search" type="search" placeholder="Cari nama atau kode guru...">
          <div id="teacherList" class="kg-list"></div>
        </section>
      </div>
    </main>
  </section>
</div>

<div id="cardModal" class="kg-card-modal hidden">
  <div class="kg-modal-box">
    <div class="teacher-card">
      <div>
        <p style="margin:0 0 8px;font-weight:800;letter-spacing:.7px">KARTU GURU • MA NURUL ISLAM</p>
        <h3 id="cardName">-</h3>
        <p id="cardMeta">-</p>
        <p style="margin-top:22px">SIMANIS • Kartu Absensi</p>
      </div>
      <div id="qrBox" class="qr-box"></div>
    </div>
    <div class="kg-modal-actions">
      <button onclick="closeCard()">Tutup</button>
      <button class="primary" onclick="window.print()">Cetak Kartu</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="sdk-loader.js"></script>
<script>
const $=id=>document.getElementById(id);
const ADMIN_ROLES=["SUPER_ADMIN","TU","WAKA_KURIKULUM"];
let api,profile,teachers=[],cards=new Map();

function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function formatRole(r){return (r||"-").replaceAll("_"," ")}
function todayYMD(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);return `${o.year}-${o.month}-${o.day}`}
function localDateID(){return new Intl.DateTimeFormat("id-ID",{timeZone:"Asia/Jakarta",weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date())}
function routeFor(code){return {DASHBOARD:"dashboard.html",ADMINISTRASI_KEPALA:"administrasi.html",DATA_SISWA:"siswa.html",DATA_GURU:"guru.html",KELAS:"kelas.html",MATA_PELAJARAN:"mapel.html",JADWAL:"jadwal.html",ABSENSI_GURU:"absensi-guru.html"}[code]||"#"}

async function loadProfile(user){
  const r=await api.db.select("profiles",`select=id,full_name,role,is_active,teacher_id&id=eq.${encodeURIComponent(user.id)}&limit=1`);
  if(!r?.[0])throw new Error("Profil pengguna tidak ditemukan.");
  if(!r[0].is_active)throw new Error("Akun tidak aktif.");
  if(!ADMIN_ROLES.includes(r[0].role))throw new Error("Anda tidak memiliki akses Kartu Guru.");
  return r[0];
}

async function loadMenu(){
  const m=await api.db.rpc("get_my_modules",{});
  $("sidebarMenu").innerHTML=(m||[]).map(x=>`<a href="${routeFor(x.code)}" class="nav-item ${x.code==="ABSENSI_GURU"?"active":""}"><span class="nav-dot"></span><span>${esc(x.name)}</span></a>`).join("");
}

async function loadData(){
  const attendance=await api.db.rpc("get_teacher_attendance_by_date",{p_date:todayYMD()})||[];
  const seen=new Map();
  attendance.forEach(r=>{
    if(r.teacher_id&&!seen.has(r.teacher_id)){
      seen.set(r.teacher_id,{
        teacher_id:r.teacher_id,
        teacher_name:r.teacher_name||"Guru",
        teacher_code:r.teacher_code||"",
        schedule_detail:r.schedule_detail||""
      });
    }
  });
  teachers=[...seen.values()].sort((a,b)=>a.teacher_name.localeCompare(b.teacher_name,"id"));

  const cardRows=await api.db.rpc("list_teacher_cards",{})||[];
  cards=new Map(cardRows.map(c=>[c.teacher_id,c]));
  render();
}

function render(){
  const q=$("searchInput").value.trim().toLowerCase();
  const list=teachers.filter(t=>`${t.teacher_name} ${t.teacher_code}`.toLowerCase().includes(q));

  if(!list.length){
    $("teacherList").innerHTML='<div class="empty-state">Tidak ada guru yang cocok.</div>';
    return;
  }

  $("teacherList").innerHTML=list.map(t=>{
    const c=cards.get(t.teacher_id);
    const active=!!c?.is_active;
    return `<article class="kg-item">
      <div>
        <div class="kg-name">${esc(t.teacher_name)}</div>
        <div class="kg-meta">Kode ${esc(t.teacher_code||"-")}</div>
        <span class="kg-badge ${active?"kg-on":"kg-off"}">${active?"KARTU AKTIF":"BELUM AKTIF"}</span>
      </div>
      <div class="kg-actions">
        ${active?`
          <button onclick="showCard('${t.teacher_id}')">Lihat / Cetak</button>
          <button class="primary" onclick="issueNew('${t.teacher_id}')">Ganti QR</button>
          <button class="danger" onclick="revokeCard('${t.teacher_id}')">Blokir</button>
        `:`
          <button class="primary" onclick="issueNew('${t.teacher_id}')">Terbitkan Kartu</button>
          <button onclick="importOld('${t.teacher_id}')">Pakai Kartu Lama</button>
        `}
      </div>
    </article>`;
  }).join("");
}

async function issueNew(id){
  if(cards.get(id)?.is_active&&!confirm("Ganti QR kartu guru ini? QR lama langsung tidak berlaku."))return;
  try{
    const r=await api.db.rpc("issue_teacher_card",{p_teacher_id:id,p_token:null});
    await loadData();
    showCard(id);
  }catch(e){alert("Gagal menerbitkan kartu: "+e.message)}
}

async function importOld(id){
  const token=prompt("Scan atau tempel token QR kartu lama di sini:");
  if(!token?.trim())return;
  try{
    await api.db.rpc("issue_teacher_card",{p_teacher_id:id,p_token:token.trim()});
    await loadData();
    showCard(id);
  }catch(e){alert("Gagal memakai kartu lama: "+e.message)}
}

async function revokeCard(id){
  if(!confirm("Blokir kartu guru ini? Kartu tidak bisa dipakai di kiosk."))return;
  try{
    await api.db.rpc("revoke_teacher_card",{p_teacher_id:id});
    await loadData();
  }catch(e){alert("Gagal memblokir kartu: "+e.message)}
}

function showCard(id){
  const t=teachers.find(x=>x.teacher_id===id);
  const c=cards.get(id);
  if(!t||!c?.is_active)return;

  $("cardName").textContent=t.teacher_name;
  $("cardMeta").textContent=`Kode ${t.teacher_code||"-"}`;
  $("qrBox").innerHTML="";
  new QRCode($("qrBox"),{text:c.card_token,width:100,height:100,correctLevel:QRCode.CorrectLevel.H});
  $("cardModal").classList.remove("hidden");
}
function closeCard(){$("cardModal").classList.add("hidden")}

$("searchInput").oninput=render;
$("cardModal").onclick=e=>{if(e.target===$("cardModal"))closeCard()};

(async function boot(){
  try{
    api=await window.simanisReady;
    const session=await api.auth.getSession();
    if(!session){location.replace("index.html");return}
    const user=await api.auth.getUser();
    profile=await loadProfile(user);

    $("sideUserName").textContent=profile.full_name||user.email||"Pengguna";
    $("sideUserRole").textContent=formatRole(profile.role);
    $("headerUser").textContent=profile.full_name||user.email||"Pengguna";
    $("currentDate").textContent=localDateID();

    await loadMenu();
    await loadData();

    $("logoutBtn").onclick=async()=>{await api.auth.signOut();location.replace("index.html")};
  }catch(err){
    console.error(err);
    alert("Kartu Guru gagal dimuat: "+(err.message||err));
    location.replace("absensi-guru.html");
  }finally{
    $("loading").classList.add("hidden");
  }
})();
</script>
</body>
</html>
